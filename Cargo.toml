[workspace]
resolver = "2"
members = ["crates/*", "examples/*"]

[workspace.package]
edition = "2024"
publish = false
license = "MIT"

[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed", package = "gpui" }
alacritty_terminal = "0.25"
portable-pty = "0.9"
futures = "0.3"
smol = "2.0"
parking_lot = "0.12"
thiserror = "2.0"
anyhow = "1.0"
log = "0.4"
itertools = "0.14"
smallvec = { version = "1.15", features = ["const_new"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
dirs = "5.0"
